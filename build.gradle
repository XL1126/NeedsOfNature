plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:${project.geckolib_version}"

    // 前置模组 Animation Director：将构建好的 JAR 放入 libs/
    // 详见 libs/README.md。缺文件时编译会失败，这是预期行为。
    modImplementation fileTree(dir: 'libs', include: "${project.animationdirector_jar_glob}")

    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.0"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.0"
    compileOnly "io.github.blackspherefollower:buttplug4j:4.0.278"
    compileOnly "io.github.blackspherefollower:buttplug4j.connectors.jetty.websocket.client:4.0.278"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// ModMenu 集成类不在本仓库编译（可选集成，按需自行接入）
sourceSets {
    main.java.exclude 'com/nonid/integration/NonModMenuIntegration.java'
}

jar {
    from('NOTICE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
